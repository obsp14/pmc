# ---- kernel / threads ----
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_HEAP_MEM_POOL_SIZE=0
CONFIG_ASSERT=y

# ---- MCTP link on USART2 (ST-LINK virtual COM port) ----
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_RING_BUFFER=y
# console + logs moved to USART1 (PA9/PA10) so they never corrupt MCTP frames
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_DEFAULT_LEVEL=3

# ---- sensors: STM32 die temperature + VREFINT through ADC1 ----
CONFIG_ADC=y
CONFIG_SENSOR=y

# ---- persistent RAS log: NVS on the storage partition ----
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_NVS=y

# ---- watchdog: per-thread software watchdogs backed by the IWDG ----
CONFIG_WATCHDOG=y
CONFIG_TASK_WDT=y
CONFIG_TASK_WDT_MIN_TIMEOUT=100
CONFIG_HWINFO=y

# ---- firmware update into MCUboot secondary slot ----
CONFIG_IMG_MANAGER=y
CONFIG_STREAM_FLASH=y
CONFIG_MCUBOOT_IMG_MANAGER=y
CONFIG_REBOOT=y

# ---- I2C target (register map read by the Linux hwmon driver) ----
CONFIG_I2C=y
CONFIG_I2C_TARGET=y
