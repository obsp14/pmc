# Build MCUboot together with the app: `west build -b nucleo_f446re --sysbuild app`
SB_CONFIG_BOOTLOADER_MCUBOOT=y
SB_CONFIG_MCUBOOT_MODE_SWAP_SCRATCH=y
SB_CONFIG_BOOT_SIGNATURE_TYPE_ECDSA_P256=y
# Replace with your own key: imgtool keygen -k keys/pmc-ecdsa-p256.pem -t ecdsa-p256
# (the default MCUboot dev key is public - anyone can sign images with it)
SB_CONFIG_BOOT_SIGNATURE_KEY_FILE="${APP_DIR}/keys/pmc-ecdsa-p256.pem"
